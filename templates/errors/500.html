{% comment %}Standalone on purpose: avoids context processors/database access while the app is erroring.{% endcomment %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong - Lead360</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; padding: 16px; box-sizing: border-box; }
        .box { max-width: 420px; text-align: center; }
        h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
        p { color: #475569; line-height: 1.5; }
        a { color: #4f46e5; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Something went wrong</h1>
        <p>An unexpected error occurred. Please try again in a moment.</p>
        <p><a href="/">Go to Lead360</a></p>
    </div>
</body>
</html>
